[project]
name = "pdf-toolkit-mcp"
version = "0.1.0"
description = "PDF Toolkit MCP Server — 26 tools for AI agents (local, private, no cloud)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.4.0",
  "pydantic>=2.0",
  "pypdf>=4.2.0",
  "PyMuPDF>=1.23.0",
  "Pillow>=10.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.0",
  "pdf2docx>=0.5.0",
  "pdfplumber>=0.11.0",
  "pikepdf>=9.0.0",
  "WeasyPrint>=62.0",
  "pytesseract>=0.3.0",
]

[project.scripts]
pdf-toolkit-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
