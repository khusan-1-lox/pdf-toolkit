version: "3.8"
services:
  api:
    build: ./backend
    mem_limit: 1.8g
    expose: ["8000"]
    ports: ["8000:8000"]
    volumes: ["./backend/app:/app/app"]
    environment:
      - TMP_ROOT=/tmp/pdf-toolkit
      - OFFICE_CONVERT_SEMAPHORE=3
      - OFFICE_CONVERT_TIMEOUT=30
    restart: unless-stopped

  web:
    build: ./frontend
    expose: ["3000"]
    ports: ["3000:3000"]
    env_file: .env
    environment:
      - API_URL=http://api:8000
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./certbot/conf:/etc/letsencrypt"
      - "./certbot/www:/var/www/certbot"
    depends_on: [web, api]
    restart: unless-stopped
